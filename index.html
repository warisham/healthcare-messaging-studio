<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Messaging Studio</title>
<meta name="description" content="Product Messaging Studio: turn trial results, white papers, competitive notes and internal updates into key messages, objection handling and battlecards for every role. Portfolio demo by Warisha Khan.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFBF8}
a{color:#5B2A86}a:hover{color:#3E1A5E}
.root{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#231B2E;background:#FFFBF8;min-height:100%}
.ic{width:20px;height:20px;flex:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.nav{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;padding:22px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brand-m{width:38px;height:38px;border-radius:12px;background:#5B2A86;color:#fff;display:grid;place-items:center}
.links{display:flex;gap:28px;margin-left:auto;font-weight:600;font-size:15px}
.links a{color:#4A3F57;text-decoration:none}.links a:hover{color:#5B2A86}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:16px;border-radius:999px;padding:13px 22px;border:2px solid transparent;cursor:pointer;text-decoration:none;min-height:48px;box-sizing:border-box}
.btn.primary{background:#5B2A86;color:#fff}.btn.primary:hover{background:#4A2070;color:#fff}
.btn.ghost{background:#fff;color:#5B2A86;border-color:#D9C8F0}.btn.ghost:hover{border-color:#5B2A86}
.btn.sm{font-size:14px;padding:10px 18px;min-height:44px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:48px;align-items:center;padding:28px 0 64px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:#FFE1D6;color:#9A3412;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px}
.hero h1{font-size:clamp(40px,5vw,58px);line-height:1.06;letter-spacing:-0.02em;margin:20px 0 16px}
.lead{font-size:19px;line-height:1.6;color:#4A3F57;margin:0 0 28px;max-width:560px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.ticks{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:28px;font-weight:600;font-size:14px;color:#4A3F57}
.ticks span{display:inline-flex;gap:8px;align-items:center}.ticks .ic{color:#2C9C86}
.hero-art{width:100%;height:auto;display:block}
.sec{padding:56px 0;border-top:1px solid #F0E6EE}
.step{display:inline-flex;align-items:center;gap:10px;font-weight:800;color:#FF7A59;font-size:14px;letter-spacing:.06em}
.step b{width:28px;height:28px;border-radius:50%;background:#FF7A59;color:#fff;display:grid;place-items:center;font-size:14px}
.sec h2{font-size:34px;margin:10px 0 8px;letter-spacing:-0.01em}
.sub{font-size:17px;color:#5F5470;margin:0 0 28px;max-width:640px;line-height:1.55}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}
.type{font:inherit;text-align:left;background:#fff;border:2px solid #EFE4F5;border-radius:24px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:#231B2E}
.type:hover{border-color:#C9B7E6}
.type[aria-pressed="true"]{border-color:#5B2A86;box-shadow:0 10px 28px rgba(91,42,134,.16)}
.card-art{width:100%;height:auto;display:block}
.type b{font-size:18px;padding:0 6px}.type span{font-size:14px;color:#5F5470;padding:0 6px 6px}
.srcbox{background:#fff;border:2px solid #EFE4F5;border-radius:24px;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}
.file{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.file-ic{width:48px;height:48px;border-radius:14px;background:#F3ECFA;color:#5B2A86;display:grid;place-items:center}
.file b{display:block}.file small{color:#5F5470;font-size:14px}
.excerpt{margin:0;line-height:1.65;color:#4A3F57;font-size:16px;background:#FFFBF8;border-radius:16px;padding:16px}
.lab{font-weight:700;font-size:14px;margin:0 0 10px}
.auds{display:flex;flex-wrap:wrap;gap:8px}
.aud{font:inherit;font-weight:600;font-size:14px;border:2px solid #EFE4F5;background:#fff;color:#4A3F57;border-radius:999px;padding:10px 16px;cursor:pointer;min-height:44px}
.aud[aria-pressed="true"]{background:#231B2E;border-color:#231B2E;color:#fff}
.gen{margin-top:18px}
.kchip{display:inline-flex;align-items:center;font-size:14px;font-weight:600;color:#9A3412;background:#FFF1EB;border-radius:10px;padding:6px 12px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:24px;align-items:start}
.leadq{background:#5B2A86;color:#fff;border-radius:24px;padding:28px;font-size:24px;line-height:1.4;font-weight:700;margin:0 0 18px}
.leadq small{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;color:#E4D6F5;margin-bottom:10px}
.kms{display:flex;flex-direction:column;gap:14px}
.km{background:#fff;border:2px solid #EFE4F5;border-radius:20px;padding:18px;display:flex;gap:16px;align-items:flex-start}
.km-n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;color:#fff}
.km-n.c0{background:#5B2A86}.km-n.c1{background:#C2410C}.km-n.c2{background:#1F7A6A}
.km h3{margin:0 0 6px;font-size:18px}.km p{margin:0;color:#5F5470;line-height:1.5;font-size:15px}
.side{display:flex;flex-direction:column;gap:18px}
.panel{background:#fff;border:2px solid #EFE4F5;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:18px;display:flex;gap:10px;align-items:center}.panel h3 .ic{color:#FF7A59}
.bc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bc div{border-radius:14px;padding:12px;font-size:14px;line-height:1.45}
.bc .us{background:#EAF6F2;color:#14532D}.bc .them{background:#F6F2F9;color:#4A3F57}
.bc b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.ask{background:#FFF1EB;border-radius:14px;padding:12px;font-size:14px;line-height:1.45;color:#7C2D12}
.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.chk{background:#FFFBF8;border-radius:14px;padding:12px;text-align:center}
.chk b{display:block;font-size:24px}.chk span{font-size:12px;color:#5F5470;font-weight:600}
.chk.ok b{color:#1F7A6A}.chk.bad b{color:#B91C1C}
.sendto{display:flex;flex-wrap:wrap;gap:8px}
.st{display:inline-flex;gap:8px;align-items:center;font:inherit;font-weight:600;font-size:14px;background:#F3ECFA;color:#3E1A5E;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
.files{display:flex;flex-direction:column;gap:10px}
.frow{display:flex;gap:12px;align-items:center;border:2px solid #EFE4F5;border-radius:16px;padding:10px 12px}
.frow.main{border-color:#C9B7E6;background:#FBF8FE}
.frow b{display:block;font-size:15px}.frow small{color:#5F5470;font-size:13px}.frow div{flex:1;min-width:0}
.file-ic.alt{background:#FFF1EB;color:#C2410C}
.ok-tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;color:#1F7A6A}.ok-tag .ic{width:16px;height:16px}
.drop{font:inherit;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center;justify-content:center;border:2px dashed #C9B7E6;background:#fff;color:#5B2A86;border-radius:16px;padding:14px;cursor:pointer;min-height:48px}
.exs{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;flex-direction:column;gap:4px}.ex span{font-size:12px;font-weight:700;color:#5F5470}
.ex input{font:inherit;font-size:15px;border:2px solid #EFE4F5;border-radius:12px;padding:10px 12px;min-height:44px;box-sizing:border-box;color:#231B2E}
.ex input:focus{outline:2px solid #5B2A86;outline-offset:1px}
.fit{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:6px}
.fit.f0{background:#5B2A86;color:#fff}.fit.f1{background:#FFE1D6;color:#9A3412}.fit.f2{background:#F3ECFA;color:#4A3F57}
.why{margin:0;line-height:1.55;color:#4A3F57;font-size:15px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.role{font:inherit;text-align:left;background:#fff;border:2px solid #EFE4F5;border-radius:22px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;color:#231B2E}
.role:hover{border-color:#C9B7E6}
.role[aria-pressed="true"]{border-color:#5B2A86;box-shadow:0 10px 28px rgba(91,42,134,.14)}
.role-h{display:flex;gap:12px;align-items:center}.role-h b{display:block;font-size:17px}.role-h small{color:#5F5470;font-size:13px}
.role-ic{width:40px;height:40px;border-radius:12px;background:#F3ECFA;color:#5B2A86;display:grid;place-items:center}
.role-k{font-size:13px;font-weight:600;color:#9A3412;background:#FFF1EB;border-radius:10px;padding:6px 10px;align-self:flex-start}
.role-l{font-size:16px;line-height:1.5;font-weight:600}
.role-t{font-size:14px;color:#5F5470;border-top:1px solid #F0E6EE;padding-top:10px}
.comp-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.strat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-bottom:18px}
.sc{border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.sc p{margin:0;line-height:1.6;font-size:16px}
.sc-k{display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:15px}
.sc.them{background:#F6F2F9}.sc.us{background:#EAF6F2}.sc.us .sc-k{color:#14532D}.sc.win{background:#5B2A86;color:#fff}.sc.win .sc-k{color:#FFD9CC}
.bc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.plays{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.5;font-size:15px}
.plays li::marker{color:#FF7A59;font-weight:800}
.objs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}
.objc{background:#fff;border:2px solid #EFE4F5;border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.o-they,.o-you{border-radius:14px;padding:14px}
.o-they{background:#F6F2F9}.o-you{background:#EAF6F2}
.o-k{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.o-they .o-k{color:#5F5470}.o-you .o-k{color:#14532D}
.o-they p,.o-you p{margin:6px 0 0;line-height:1.5;font-size:16px}
.o-they p{font-weight:600}
.o-proof{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:#4A3F57}.o-proof .ic{color:#5B2A86;margin-top:1px}
.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.ev{background:#fff;border:2px solid #EFE4F5;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px}
.ev h3{margin:0;font-size:17px}
.dstep{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.dnum{width:32px;height:32px;border-radius:50%;background:#5B2A86;color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.dstep b{display:block;font-size:15px}.dstep p{margin:2px 0 0;font-size:14px;color:#5F5470;line-height:1.45}
.ibars{display:flex;gap:28px;align-items:flex-end;height:180px;padding:0 12px;border-bottom:2px solid #D9C8F0}
.ibar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.ibar i{display:block;width:100%;max-width:90px;border-radius:12px 12px 0 0}
.ibar b{font-size:22px}
.iblabels{display:flex;gap:28px;padding:0 12px}.iblabels span{flex:1;text-align:center;font-size:13px;color:#5F5470;font-weight:600}
.delta{display:inline-flex;gap:6px;align-items:center;align-self:flex-start;background:#EAF6F2;color:#14532D;font-weight:700;padding:8px 12px;border-radius:12px;font-size:15px}
.donut{display:flex;gap:16px;align-items:center}
.donut svg{width:130px;height:130px;flex:none}
.donut p{margin:0;line-height:1.5;font-size:15px}
.big{font-size:42px;font-weight:800;line-height:1}
.safe{display:flex;gap:12px;align-items:center;background:#EAF6F2;color:#14532D;border-radius:14px;padding:12px;font-size:14px;line-height:1.45}
.safe b{font-size:28px}
.lead-with{background:#FFF1EB;border-radius:18px;padding:16px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;color:#4A2A1A}
.lead-with .ic{color:#C2410C;margin-top:3px}
.caption{font-size:13px;color:#5F5470;line-height:1.5;margin:12px 0 0}
.foot{padding:28px 0 48px;color:#5F5470;font-size:13px;line-height:1.6;border-top:1px solid #F0E6EE;margin-top:24px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.drop:focus-within{outline:3px solid #5B2A86;outline-offset:2px}
.rm{font:inherit;border:0;background:transparent;color:#5F5470;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.rm:hover{background:#F3ECFA;color:#231B2E}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#231B2E;color:#fff;font-weight:600;font-size:15px;padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100% - 48px);text-align:center;z-index:10}
.toast:empty{display:none}
:focus-visible{outline:3px solid #5B2A86;outline-offset:2px}
.links a,.type,.aud,.role,.st,.btn{-webkit-tap-highlight-color:transparent}
.links a{display:inline-flex;align-items:center;min-height:44px}
@media (max-width:640px){.wrap{padding:0 18px}.links{gap:18px;margin-left:0;order:3;width:100%}.nav .btn.sm{margin-left:auto}.hero{gap:28px;padding-bottom:40px}.sec{padding:40px 0}.sec h2{font-size:28px}.leadq{font-size:20px;padding:22px}.srcbox{padding:16px}.bc{grid-template-columns:minmax(0,1fr)}.sc{padding:18px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}

</style>

<a class="btn primary sm" href="#start"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 20h14"></path></svg>New project</a></nav>

<section class="hero">
<div><span class="eyebrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4"></path><path d="M12 17v4"></path><path d="M3 12h4"></path><path d="M17 12h4"></path><path d="m6 6 2.5 2.5"></path><path d="m15.5 15.5 2.5 2.5"></path><path d="m6 18 2.5-2.5"></path><path d="m15.5 8.5 2.5-2.5"></path></svg>For product marketing and sales teams</span>
<h1>Drop in any content. Get messages your team can use today.</h1>
<p class="lead">Upload a trial summary, a white paper, competitor notes or an internal update. Product Messaging Studio pulls out the key messages, writes them for each audience and builds the battlecard, with claim checks done.</p>
<div class="row"><a class="btn primary" href="#start"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M5 20h14"></path></svg>Upload content</a><a class="btn ghost" href="#results">See an example</a></div>
<div class="ticks"><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>Regulatory claim checks</span><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>Plain-language scoring</span><span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"></path><path d="M22 2 11 13"></path></svg>Exports to decks, email and CRM</span></div></div>

<section class="sec" id="start">
<span class="step"><b>1</b>START FROM ANYTHING</span>
<h2>What do you have?</h2>

<script>
// Tiny runtime: renders the same {{holes}} / <sc-for> / <sc-if> / onX templates the mockup uses, with plain DOM.
class DCLogic { constructor(props) { this.props = props || {}; this.state = {}; } setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); APP.render(); } }
const APP = (() => {
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const look = (scope, path) => {
    path = path.trim();
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
  };
  const interp = (str, scope) => str.replace(HOLE, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); });
  const whole = str => { const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str); return m ? m[1] : null; };
  const EVT = { onClick: 'click', onChange: 'change', onInput: 'input', onKeyDown: 'keydown', onSubmit: 'submit' };
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const list = look(scope, whole(node.getAttribute('list')) || '') || [];
      const as = node.getAttribute('as') || 'item';
      list.forEach((item, i) => node.childNodes.forEach(c => build(c, { ...scope, [as]: item, $index: i }, out)));
      return;
    }
    if (tag === 'sc-if') { if (look(scope, whole(node.getAttribute('value')) || '')) node.childNodes.forEach(c => build(c, scope, out)); return; }
    const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, tag) : document.createElement(tag);
    let value;
    for (const { name, value: raw } of [...node.attributes]) {
      if (name.startsWith('hint-')) continue;
      const evName = Object.keys(EVT).find(k => k.toLowerCase() === name.toLowerCase());
      if (evName) { const fn = look(scope, whole(raw) || ''); if (typeof fn === 'function') el.addEventListener(EVT[evName], fn); continue; }
      const v = whole(raw) ? look(scope, whole(raw)) : interp(raw, scope);
      if (name === 'value' && (tag === 'select' || tag === 'input' || tag === 'textarea')) { value = v; continue; }
      el.setAttribute(name, v == null ? '' : String(v));
    }
    node.childNodes.forEach(c => build(c, scope, el));
    if (value !== undefined) el.value = value == null ? '' : value;
    out.appendChild(el);
  }
  const pathOf = el => { if (!el || !root || !root.contains(el) || el === root) return null; const p = []; while (el !== root) { p.unshift([...el.parentNode.children].indexOf(el)); el = el.parentNode; } return p; };
  let root, tpl, comp;
  return {
    mount(r, templateEl, Comp) { root = r; tpl = templateEl.content; comp = new Comp({}); this.render(); },
    render() {
      if (!comp) return;
      const focus = pathOf(document.activeElement);
      const frag = document.createDocumentFragment();
      const vals = comp.renderVals();
      tpl.childNodes.forEach(c => build(c, vals, frag));
      root.replaceChildren(frag);
      if (focus) { let el = root; for (const i of focus) { el = el && el.children[i]; } if (el && el.focus) el.focus({ preventScroll: true }); }
      if (comp.afterRender) comp.afterRender(root);
    }
  };
})();

function syllables(w) { w = w.toLowerCase().replace(/[^a-z]/g, ''); if (w.length <= 3) return 1; w = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, ''); const m = w.match(/[aeiouy]{1,2}/g); return m ? m.length : 1; }
function grade(text) {
  const sents = Math.max(1, (text.match(/[.!?:]+(\s|$)/g) || []).length + (text.match(/\n/g) || []).length);
  const words = text.split(/\s+/).filter(w => /[a-z]/i.test(w));
  if (!words.length) return 0;
  const syl = words.reduce((a, w) => a + syllables(w), 0);
  return Math.max(0, 0.39 * (words.length / sents) + 11.8 * (syl / words.length) - 15.59);
}
